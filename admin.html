<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КТО Я? — аналитика</title><style>body{background:#10101a;color:#eee;font:15px system-ui;margin:0;padding:24px}main{max-width:1100px;margin:auto}h1{font-size:28px}section{background:#1e1d2c;border:1px solid #35334b;border-radius:16px;padding:18px;margin:16px 0;overflow:auto}input,select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #57516c;background:#262339;color:white;margin:5px 0}input{width:min(90%,440px)}button{background:#8057cd;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #38354b}small{color:#b6aacb}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.kpi{background:#29253d;padding:16px;border-radius:12px}.kpi b{display:block;font-size:25px;color:#e6c5ff}.bar{height:8px;background:#a688eb;border-radius:6px}</style></head><body><main><h1>КТО Я? · Аналитика</h1><small>Доступ по секретному ключу. Только согласившиеся на аналитику посетители; платежи отдельно по серверным подтверждениям.</small><section><form id="login"><label>Адрес Worker<br><input id="endpoint" type="url" required placeholder="https://your-worker.workers.dev"></label><br><label>Ключ администратора<br><input id="key" type="password" required autocomplete="current-password"></label><br><select id="days"><option value="1">24 часа</option><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option></select> <button>Обновить данные</button></form><p id="status" role="status"></p></section><div id="out"></div></main><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(title,rows,cols)=>'<section><h2>'+esc(title)+'</h2>'+(rows?.length?'<table><thead><tr>'+cols.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<small>Пока нет данных</small>')+'</section>';
$('login').onsubmit=async e=>{e.preventDefault();$('status').textContent='Загрузка…';try{let url=new URL($('endpoint').value);if(url.protocol!=='https:')throw Error('Требуется HTTPS');const r=await fetch(url.origin+'/analytics-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:$('key').value,days:+$('days').value})});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);const k=[['Посетители',d.totals.visitors],['Сессии',d.totals.sessions],['Вернулись в другой день',d.returners.returning],['Платежи',d.purchases.reduce((s,x)=>s+x.purchases,0)],['Stars',d.purchases.reduce((s,x)=>s+x.stars,0)]];$('out').innerHTML='<section class="kpis">'+k.map(x=>'<div class="kpi"><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>').join('')+'</section>'+table('Воронка (уникальные посетители на каждом событии, не последовательная когорта)',d.funnel,[['type','Событие'],['visitors','Люди'],['events','Действия']])+table('Источники и кампании',d.sources,[['source','Источник'],['campaign','Кампания'],['visitors','Люди']])+table('Популярность разделов',d.screens,[['section','Раздел'],['views','Просмотры'],['visitors','Люди']])+table('Время в разделах',d.times,[['section','Раздел'],['avg_seconds','Среднее, сек'],['total_seconds','Всего, сек']])+table('Цели',d.goals,[['goal','Цель'],['visitors','Люди']])+table('Динамика по дням',d.daily,[['day','Дата UTC'],['visitors','Люди']])+table('Переходы в UNIQ',d.uniqSources,[['source','Источник'],['campaign','Кампания'],['visitors','Люди']])+table('Подтверждённые покупки',d.purchases,[['pack','Пакет'],['purchases','Оплаты'],['stars','Stars']]);$('status').textContent='Данные обновлены';}catch(e){$('status').textContent='Не удалось получить данные: '+e.message;}};
</script></body></html>
